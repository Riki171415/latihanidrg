<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun Neon · iDRG Learning</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100dvh;padding:24px;background:#f1f5f9}.neon-panel{width:min(100%,480px);padding:32px}.neon-panel input{width:100%;margin:8px 0 18px}.neon-panel .actions{display:flex;gap:12px;flex-wrap:wrap}.neon-panel h1{margin:12px 0}.neon-panel label{display:block}.neon-panel button{margin-top:8px}</style></head>
<body><main class="card neon-panel"><p class="eyebrow">iDRG LEARNING · AKUN NEON</p><h1 id="title">Daftar akun</h1><p class="muted">Akun untuk layanan alternatif. Nilai pada layanan utama tetap tersimpan terpisah.</p>
<form id="identity-form"><div id="name-field"><label for="name">Nama lengkap</label><input id="name" autocomplete="name" required maxlength="120"></div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"><button id="submit" type="submit">Daftar</button></form>
<div class="actions"><button id="switch" type="button" class="secondary">Sudah punya akun? Masuk</button><button id="logout" type="button" class="secondary" hidden>Keluar</button></div><p id="status" role="status" aria-live="polite"></p><p id="current-user" hidden></p><a href="/">Kembali ke latihan</a></main>
<script type="application/json" id="neon-config">__NEON_CONFIG__</script><script src="neon-auth.js" defer></script></body></html>
